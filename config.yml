# --- 경로 설정 ---
dataPath: W:\ComfyU-auto-script_data  # 설정파일 폴더. 변경시 재실행 필요.
base_dir: W:\ComfyUI_windows_portable  # 작업 디렉토리

# --- 처리할 타입 리스트 ---
CheckpointTypes: # Checkpoint 및 Lora 종류. 뒤의 숫자는 사용할 가중치. 키 추가시 재실행 필요. 가중치는 실시간 반영
  IL: 1
  Anime: 1
  # Pony: 1

# --- 경로 설정 ---
CheckpointPath: ComfyUI/models/checkpoints # Checkpoint 폴더. 변경시 재실행 필요.
unetPath: ComfyUI/models/diffusion_models # Checkpoint 폴더. 변경시 재실행 필요.
LoraPath: ComfyUI/models/loras # Lora 폴더. 변경시 재실행 필요.
LoraEtcPath: etc # LoraPath / etc 폴더. 변경시 재실행 필요. 하위폴더는 인식 안함.
LoraCharPath: char # LoraPath 안의 char 폴더. 변경시 재실행 필요. 하위폴더는 인식 안함.
# UNUSED: 현재 코드는 get_file_dict_list()에서 '*.safetensors'를 하드코딩해서 이 값을 읽지 않음.
safetensorsFile: '*.safetensors' # Checkpoint 및 Lora 파일 확장자.
workflow_api: workflow_api.json # ComfyUI 로 보낼 workflow api 파일. dataPath+CheckpointTypes에 넣음
url: http://127.0.0.1:8188/prompt # ComfyUI 로 보낼 url. ComfyUI가 실행중이어야 함
url2: http://127.0.0.1:8188/ # ComfyUI 로 보낼 url. ComfyUI가 실행중이어야 함

# safetensorsStart: 'IL\nattyIllustrious_v20.safetensors'

# --- 반복 설정 ---
# CheckpointLoop * CharLoop * QueueLoop 횟수만큼 무한 반복
# CheckpointLoop: [5, 5] # Checkpoint 반복 횟수. 한번 돌때마다 Char 값이 바뀜
CheckpointLoop: 1 # Checkpoint 반복 횟수. 한번 돌때마다 Char 값이 바뀜
# CharLoop: [3, 3] # Char 반복 횟수. 한번 돌때마다 Lora 값이 바뀜
CharLoop: 1 # Char 반복 횟수. 한번 돌때마다 Lora 값이 바뀜
# queueLoop: [3, 3] # Queue 반복 횟수
queueLoop: 1 # Queue 반복 횟수

# --- Checkpoint 적용 설정 ---
GetCheckpointKind:
    DB: 1
    Weight: 2 # {type}/Checkpoint/*.yml , {type}/WeightChar.yml 순으로 찿아서 참조
    Random: 1 # 파일 목록중에서 랜덤 선택
    Cycle: 1
    Skip: 1
    Skip_Weight: 2
    Favorites: 3
    Favorites_Weight: 3
    fromImg: 1

fromImgPath: 'Y:\photo\_2d\'
fromImgMaxRetries: 100
fromImgIf: 
  UltralyticsDetectorProvider:
    model_name: 'bbox/face_yolov9c.pt'
    

# UNUSED: DB 선택 가중치는 CheckpointDbWeightMax/Min만 사용하고 이 값은 읽지 않음.
CheckpointDbWeight: 3 # GetCharKind 에서 DB일 경우 최대 가중치
CheckpointDbWeightMax: 9 # GetCharKind 에서 DB일 경우 최대 가중치
CheckpointDbWeightMin: 1 # GetCharKind 에서 DB일 경우 최소 가중치

# --- char 적용 설정 ---
GetCharKind:
    Wildcard: 1
    DB: 1
    Weight: 2 # {type}/lora/*.yml , {type}/WeightChar.yml 순으로 찿아서 참조
    Random: 1 # 파일 목록중에서 랜덤 선택
    Cycle: 1
    Skip: 1
    Skip_Weight: 2
    Favorites: 3
    Favorites_Weight: 3

CharDbWeightMax: 9 # GetCharKind 에서 DB일 경우 최대 가중치
CharDbWeightMin: 1 # GetCharKind 에서 DB일 경우 최소 가중치

CharWildcard: # Char 파일을 안쓸 경우 Wildcard 설정
  positive:
    char: '/**/{__danbooru_female_character_my__|__danbooru_female_character_my_simple__},/**/'
  negative:
    char: ''

# --- Lora 적용 설정 ---
GetLoraKind:
    Wildcard: 1
    DB: 1
    Weight: 8 # WeightLora.yml 참조
    Random: 1 # 파일 목록중에서 랜덤 선택
    Cycle: 1

LoraWildcard: # GetLoraKind 에서 Wildcard 경우
  positive:
    action_set: '/**/{__action_set/action_set__| , },/**/'
  negative:
    action_set: ''

# LoraWildcardEtc: # DB Random Cycle
  # positive:
    # Wildcard: '/**/__action__,/**/'
  # negative:
    # Wildcard: ''

LoraDbWeightMax: 9 # GetLoraKind 에서 DB일 경우 최대 가중치
LoraDbWeightMin: 1 # GetLoraKind 에서 DB일 경우 최소 가중치
LoraDbCnt: [1,2] # GetLoraKind 에서 DB일 경우 DatabaseHandler에서 가져가 쓸 갯수

LoraRandomCnt: [1,2] # GetLoraKind 에서 Random일 경우 목록에서 가져가 쓸 갯수

# UNUSED: Lora Cycle도 현재 logic_selector.py에서 LoraRandomCnt를 사용함.
LoraCycleCnt: [1,2] # GetLoraKind 에서 DB일 경우 DatabaseHandler에서 가져가 쓸 갯수

# --- Weight 설정 ---
CheckpointWeightPer: 0.75 # WeightCheckpoint.yml 파일을 쓸 확률
CharWeightPer: 0.75 # char weight를 쓸 확률. 가중치는 WeightChar.yml 파일과 [dataPath]/[CheckpointType]\lora\*.yml파일의 weight 값을 씀
CharWeightDefault: 3 # [dataPath]/[CheckpointType]/lora/*.Yml 에 weight 값이 없을 경우 기본값.
CheckpointWeightDefault: 3 # [dataPath]/[CheckpointType]/checkpoint/*.Yml 에 weight 값이 없을 경우 기본값.

# --- 랜덤 설정 ---
shuffleWildcard: # Wildcard를 섞을 여부. shuffleWildcardPrint이 True일 경우 섞기 전과 후를 출력함
  true: 1
  false: 1

# --- 이미지 저장 설정 ---
noSaveImage1: true # SaveImage1 노드의 images 입력을 제거할지 여부


# --- SetSetupWorkflowToWorkflowApi 설정 ---
# workflow_api에 setupWorkflow.yml의 내용을 넣을때 제외할 노드
excludeNode: 
  - CheckpointLoaderSimple
  - KSampler
  - CLIPTextEncodeP
  - CLIPTextEncodeN
  # - VAELoader
  - VAEDecode
  - SaveImage1
  - SaveImage2
  - positiveWildcard
  - negativeWildcard
  - PreviewImage24
  - PreviewImage25
  - PreviewImage26

# --- 수정 여부 확인 ---
수정 안해서 작동 안시킴: false # 수정 했으면 이 라인은 지우거나 False로 변경하세요. True로 되어 있으면 작동 안함

# --- sleep 설정 ---
sleep: [1, 1] # 루프 간 대기 시간 (초)

# --- queue 설정 ---
queue_prompt: true # ComfyUI에 프롬프트 전송 여부
queue_prompt_wait: true # 큐 대기 여부


# positivePrint: true # tivePrint 출력 여부
# tivePrint: true # tivePrint 출력 여부
# WorkflowPrint: true # ComfyUI로 보낼기 직전 workflow_api 출력 여부
# sleep: 1 # 루프 간 대기 시간 (초)
# queue_prompt_wait: false # 큐 대기 여부
# queue_prompt: false # ComfyUI에 프롬프트 전송 여부

# WorkflowSave: true # ComfyUI로 보낼기 직전 workflow_api 출력 여부